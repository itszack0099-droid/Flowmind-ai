name: flowmind
description: FlowMind AI - Your Personal AI Mentor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  animate_do: ^3.3.4
  smooth_page_indicator: ^1.1.0
  go_router: ^13.0.0
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.3.0
  app_links: ^3.5.1
  file_picker: ^8.0.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  pdfx: ^2.8.0
  docx_to_text: ^1.0.0
  http: ^1.2.2
  http_parser: ^4.0.2
  llamadart: ^0.6.10
  firebase_core: ^2.30.0

dependency_overrides:
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/