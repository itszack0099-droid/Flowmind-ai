name: Build FlowMind APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Flutter Analytics
        run: |
          flutter config --no-analytics
          dart --disable-analytics || true

      - name: Show Flutter version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Regenerate Android Folder
        run: |
          # Always regenerate so the android folder matches the installed Flutter version.
          # This avoids "unsupported Gradle project" errors from stale/incompatible files.
          rm -rf android
          flutter create \
            --platforms=android \
            --org=com.flowmind \
            --project-name=flowmind \
            --no-pub \
            .
          chmod +x android/gradlew
          echo "✅ Android folder regenerated for Flutter $(flutter --version | head -1)"
          ls -la android/

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowMind-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
