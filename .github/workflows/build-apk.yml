name: Build FlowMind APK - Final Clean

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Latest Stable Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: false

      - name: Force Fresh Dependencies
        run: |
          flutter clean
          rm -f pubspec.lock
          rm -rf \~/.pub-cache
          flutter pub get

      - name: Create Fresh Android Folder
        run: |
          rm -rf android build .gradle .flutter-plugins* .metadata android.iml
          flutter create temp_project --platforms=android --org=com.flowmind --project-name flowmind
          cp -r temp_project/android ./
          rm -rf temp_project
          echo "✅ Fresh android folder created"

      - name: Fix Gradle Configuration
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              packagingOptions {
                  exclude 'META-INF/services/io.flutter.embedding.engine.plugins.PluginRegistrant'
                  pickFirst 'lib/arm64-v8a/libc++_shared.so'
                  pickFirst 'lib/armeabi-v7a/libc++_shared.so'
                  pickFirst 'lib/x86/libc++_shared.so'
                  pickFirst 'lib/x86_64/libc++_shared.so'
              }
          }
          EOF

      - name: Fix Gradle Permission
        run: chmod +x android/gradlew || true

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowMind-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30