name: Build FlowMind APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Old Cached Flutter Completely
        run: rm -rf /opt/hostedtoolcache/flutter

      - name: Setup Flutter 3.27.0 (Fresh)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: false

      - name: Verify Flutter & Dart Version
        run: |
          flutter --version
          dart --version

      - name: Force Clean Everything
        run: |
          flutter clean
          rm -f pubspec.lock
          rm -rf \~/.pub-cache
          flutter pub get

      - name: Regenerate Android Folder
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.flowmind

      - name: Fix Gradle permission
        run: chmod +x android/gradlew || true

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowMind-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30