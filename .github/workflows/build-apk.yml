name: Build FlowMind APK - FINAL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Latest Stable Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: false

      - name: Clean Everything
        run: |
          flutter clean
          rm -f pubspec.lock
          rm -rf \~/.pub-cache
          rm -rf android build .gradle .flutter-plugins* .metadata android.iml

      - name: Create Fresh Android Folder
        run: |
          flutter create temp_project --platforms=android --org=com.flowmind --project-name flowmind
          cp -r temp_project/android ./
          rm -rf temp_project
          echo "✅ Fresh android folder created"
          ls -la android/

      - name: Fix Gradle Permission
        run: chmod +x android/gradlew || true

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowMind-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30