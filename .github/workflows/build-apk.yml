name: Build FlowMind APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.27.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: false

      - name: Regenerate Android Folder (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder missing → Regenerating..."
            flutter create . --platforms=android --org=com.flowmind
          else
            echo "Android folder exists"
          fi

      - name: Verify Flutter
        run: flutter --version

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          rm -f pubspec.lock
          rm -rf \~/.pub-cache
          flutter pub get

      - name: Fix Gradle permission
        run: chmod +x android/gradlew || true

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowMind-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Show APK Size
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk