name: Build FlowMind APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Manually Install Fresh Flutter 3.27.0
        run: |
          rm -rf $GITHUB_WORKSPACE/flutter
          git clone -b stable --depth 1 https://github.com/flutter/flutter.git $GITHUB_WORKSPACE/flutter
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH

      - name: Verify Flutter Version
        run: flutter --version

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          rm -f pubspec.lock
          rm -rf \~/.pub-cache
          flutter pub get

      - name: Regenerate Android Folder (if missing)
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org=com.flowmind
          fi

      - name: Fix Gradle permission
        run: chmod +x android/gradlew || true

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowMind-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30