name: Build FlowMind APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Old Flutter Cache
        run: rm -rf /opt/hostedtoolcache/flutter

      - name: Setup Latest Stable Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: false

      - name: Force Create Fresh pubspec.lock
        run: |
          flutter clean
          rm -f pubspec.lock
          rm -rf \~/.pub-cache
          flutter pub get

      - name: Completely Regenerate Android Folder (Critical Fix)
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.flowmind

      - name: Fix flutter_local_notifications Linux Issue
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              packagingOptions {
                  exclude 'META-INF/services/io.flutter.embedding.engine.plugins.PluginRegistrant'
                  pickFirst 'lib/arm64-v8a/libc++_shared.so'
                  pickFirst 'lib/armeabi-v7a/libc++_shared.so'
                  pickFirst 'lib/x86/libc++_shared.so'
                  pickFirst 'lib/x86_64/libc++_shared.so'
              }
          }
          EOF

      - name: Fix Gradle Permission
        run: chmod +x android/gradlew || true

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowMind-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30