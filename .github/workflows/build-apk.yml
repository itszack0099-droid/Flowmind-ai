name: Build FlowMind APK - NEW PROJECT METHOD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Latest Stable Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: false

      - name: Create Fresh New Flutter Project (Exact Fix)
        run: |
          flutter clean
          rm -f pubspec.lock
          rm -rf \~/.pub-cache
          rm -rf android build

          # Naya clean project create karo
          flutter create temp_new_project --platforms=android --org=com.flowmind --project-name flowmind

          # Purane project ke important files copy kar do
          cp -r temp_new_project/android ./
          cp pubspec.yaml temp_new_project/
          cp -r lib/ temp_new_project/lib/
          cp -r assets/ temp_new_project/assets/ 2>/dev/null || true
          cp -r .github/ temp_new_project/ 2>/dev/null || true

          # Naye project mein move kar do
          rm -rf temp_new_project
          mv temp_new_project/* ./
          mv temp_new_project/.* ./ 2>/dev/null || true
          rm -rf temp_new_project

          echo "✅ Fresh project created and old code moved"

      - name: Fix flutter_local_notifications Issue
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              packagingOptions {
                  exclude 'META-INF/services/io.flutter.embedding.engine.plugins.PluginRegistrant'
                  pickFirst 'lib/arm64-v8a/libc++_shared.so'
                  pickFirst 'lib/armeabi-v7a/libc++_shared.so'
                  pickFirst 'lib/x86/libc++_shared.so'
                  pickFirst 'lib/x86_64/libc++_shared.so'
              }
          }
          EOF

      - name: Fix Gradle Permission
        run: chmod +x android/gradlew || true

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowMind-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30